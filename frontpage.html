<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mould Preventive Maintenance Plan — ToolSync PM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Space Grotesk", "system-ui", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"]
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#0b0d11] text-stone-100 min-h-screen antialiased">
    <!-- Top Bar -->
    <header class="sticky top-0 z-30 border-b border-stone-800 bg-[#0b0d11]/95 backdrop-blur">
        <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-amber-400 text-stone-950 font-mono font-bold flex items-center justify-center text-xs">
                    PM
                </div>
                <div>
                    <h1 id="sheet-main-title" class="text-sm sm:text-base font-bold uppercase tracking-wide text-amber-300">
                        MOULD PREVENTIVE MAINTENANCE PLAN NOVEMBER - 2026
                    </h1>
                    <p class="text-[11px] font-mono text-stone-400">
                        Click any date cell under a Tool Number to toggle <span class="text-emerald-300 font-bold">P</span> (Plan)
                    </p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 text-xs font-mono">
                <input
                    id="month-picker"
                    type="month"
                    value="2026-11"
                    class="bg-[#181d28] border border-stone-700 rounded-lg px-2.5 py-1.5 text-amber-300"
                />
                <input
                    id="tool-search-input"
                    type="text"
                    placeholder="Search Tool No..."
                    class="bg-[#181d28] border border-stone-700 rounded-lg px-2.5 py-1.5 text-white placeholder-stone-500"
                />
                <button
                    id="toggle-add-tool-btn"
                    type="button"
                    class="px-3 py-1.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-stone-950 font-bold"
                >
                    + Add Tool
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-4 py-4 space-y-4">
        <!-- Quick Add Tool Form -->
        <section id="add-tool-panel" class="hidden rounded-2xl bg-[#11151d] border border-amber-400/40 p-4">
            <form id="add-tool-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
                <input
                    id="new-tool-number"
                    type="text"
                    required
                    placeholder="TOOL NUMBER (e.g. 145W410441-00202)"
                    class="lg:col-span-2 bg-[#0b0d11] border border-stone-700 rounded-lg px-3 py-2 text-xs font-mono text-white"
                />
                <input
                    id="new-tool-pm-date"
                    type="date"
                    value="2026-11-22"
                    class="bg-[#0b0d11] border border-stone-700 rounded-lg px-3 py-2 text-xs font-mono text-amber-300"
                />
                <input
                    id="new-tool-mark"
                    type="text"
                    value="P"
                    maxlength="4"
                    placeholder="Mark (P)"
                    class="bg-[#0b0d11] border border-stone-700 rounded-lg px-3 py-2 text-xs font-mono uppercase text-emerald-300"
                />
                <button
                    type="submit"
                    class="bg-emerald-400 hover:bg-emerald-300 text-stone-950 font-mono font-bold text-xs rounded-lg px-4 py-2"
                >
                    Add to Plan
                </button>
            </form>
        </section>

        <!-- Sheet Matrix Container -->
        <section class="rounded-2xl bg-[#11151d] border-2 border-stone-700 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-xs font-mono">
                    <thead>
                        <tr class="border-b-2 border-stone-600 bg-[#151a24] text-stone-100">
                            <th class="sticky left-0 z-20 bg-[#151a24] py-2.5 px-2.5 border-r border-stone-700 text-center w-12">
                                Sr. No
                            </th>
                            <th class="sticky left-12 z-20 bg-[#151a24] py-2.5 px-3 border-r-2 border-stone-600 text-left min-w-[210px]">
                                TOOL NUMBER
                            </th>
                            <th id="date-headers-slot" colspan="30" class="py-2 px-2 text-center text-amber-300 tracking-wider">
                                DATES
                            </th>
                        </tr>
                        <tr id="pm-date-header-row" class="border-b-2 border-stone-600 bg-[#0d1017] text-[10px] text-stone-300">
                            <th class="sticky left-0 z-20 bg-[#0d1017] border-r border-stone-800"></th>
                            <th class="sticky left-12 z-20 bg-[#0d1017] border-r-2 border-stone-600 px-3 py-1.5 text-left text-stone-400">
                                Mould Code
                            </th>
                        </tr>
                    </thead>
                    <tbody id="pm-matrix-tbody" class="divide-y divide-stone-800"></tbody>
                </table>
            </div>

            <!-- Footer Sign-off (Prepared By / Approved By) -->
            <div class="px-5 py-4 border-t-2 border-stone-700 bg-[#0d1017] grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs font-mono">
                <div class="flex items-center gap-2">
                    <span class="text-stone-400 shrink-0">Prepared By :</span>
                    <input
                        id="prepared-by-input"
                        type="text"
                        placeholder="Enter name..."
                        class="w-full max-w-xs bg-[#11151d] border-b border-stone-600 focus:border-amber-400 focus:outline-none px-2 py-1 text-stone-100"
                    />
                </div>
                <div class="flex items-center gap-2 sm:justify-end">
                    <span class="text-stone-400 shrink-0">Approved By :</span>
                    <input
                        id="approved-by-input"
                        type="text"
                        placeholder="Enter name..."
                        class="w-full max-w-xs bg-[#11151d] border-b border-stone-600 focus:border-emerald-400 focus:outline-none px-2 py-1 text-stone-100"
                    />
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 pointer-events-none transition-all duration-300 rounded-xl bg-stone-900 border border-amber-400/50 px-4 py-2.5 text-xs font-mono text-amber-200"></div>

    <script src="shared.js"></script>
    <script src="script.js"></script>
</body>
</html>
